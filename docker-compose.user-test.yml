services:
  gateway:
    ports: !override
      - "127.0.0.1:18080:8080"
    volumes:
      - ./deploy/Caddyfile.user-test:/etc/caddy/Caddyfile:ro

  api:
    environment:
      BEYOND_WORDS_ENV: user-test
      BEYOND_WORDS_SESSION_COOKIE_SECURE: "false"
      BEYOND_WORDS_FRONTEND_URL: http://127.0.0.1:18080
      BEYOND_WORDS_CORS_ORIGINS: http://127.0.0.1:18080
      BEYOND_WORDS_DEV_SHOW_RESET_TOKEN: "false"
      BEYOND_WORDS_GRAFANA_URL: http://127.0.0.1:${GRAFANA_HOST_PORT:-13000}

  worker:
    environment:
      BEYOND_WORDS_ENV: user-test

  worker-qwen:
    environment:
      BEYOND_WORDS_ENV: user-test

  grafana:
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-13000}:3000"
